{% extends "base.html" %}
{% block content %}
<div class="container content-shell">
  <header class="page-heading"><h1>News</h1><p>Updates from the Moose project.</p><a class="feed-link" href="{{ get_url(path='news/atom.xml') }}">{{ <icon name="application-rss+xml-symbolic" /> }}Subscribe with Atom</a></header>
  <div class="news-list">
    {% for post in section.pages %}
    <article class="news-entry"><time datetime="{{ post.date }}">{{ post.date | date(format="%B %d, %Y") }}</time><h2><a href="{{ post.permalink }}">{{ post.title }}</a></h2><p>{{ post.description }}</p><a class="text-link" href="{{ post.permalink }}">Read More</a></article>
    {% endfor %}
  </div>
</div>
{% endblock content %}
