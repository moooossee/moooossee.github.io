{% extends "base.html" %}
{% block content %}
<div class="container content-shell"><header class="page-heading"><p class="eyebrow">~/ NEWS</p><h1>News</h1><p>Updates from the Moose project.</p><a class="text-link" href="{{ get_url(path='news/atom.xml') }}">Atom feed</a></header><div class="news-list">{% for post in section.pages %}<article><time datetime="{{ post.date }}">{{ post.date | date(format="%b %d, %Y") }}</time><h2><a href="{{ post.permalink }}">{{ post.title }}</a></h2><p>{{ post.description }}</p><a class="text-link" href="{{ post.permalink }}">Read the update</a></article>{% endfor %}</div></div>
{% endblock content %}
