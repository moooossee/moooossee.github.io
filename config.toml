base_url = "https://moooossee.github.io"
title = "Moose"
description = "Chat with local and cloud AI on Linux. Manage Ollama, connect your own providers, and bring images and documents into a native GTK and libadwaita app."
default_language = "en"
compile_sass = false
minify_html = true
build_search_index = false
generate_feeds = false

[markdown]
external_links_target_blank = true
external_links_no_referrer = true
smart_punctuation = true

[markdown.highlighting]
theme = "github-dark"
style = "inline"

[extra]
version = "0.6.5"
release_notes = "changelog/0-6-5.md"
providers = ["Ollama Cloud", "Groq", "OpenAI", "Anthropic Claude", "Google Gemini", "Mistral AI", "DeepSeek", "NVIDIA NIM", "Cloudflare Workers AI"]
repository = "https://github.com/moooossee/moose"
flathub = "https://flathub.org/apps/io.github.moooossee.Moose"
install_command = "flatpak install flathub io.github.moooossee.Moose"
run_command = "flatpak run io.github.moooossee.Moose"
